spring:
  application:
    name: ai-job-matcher
    
  datasource:
    url: jdbc:postgresql://localhost:5434/ai_job_matcher
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
      
    show-sql: true
    
    properties:
      hibernate:
        format_sql: true
        
server:
  port: 8080